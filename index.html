<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faculty Feedback & Course Evaluation Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#14203f;--muted:#5d6b8a;--line:#e3e8f3;--p:#3557f5;--pt:#fff;--p2:#e8edff;--ac:#13b5a0;--star:#f5a623;--bad:#d6334a;--shadow:0 8px 30px rgba(20,32,63,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--surface:#172038;--ink:#e8edfb;--muted:#9aa7c7;--line:#26314f;--p:#7b93ff;--pt:#0e1424;--p2:#1f2b52;--shadow:0 8px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e1424;--surface:#172038;--ink:#e8edfb;--muted:#9aa7c7;--line:#26314f;--p:#7b93ff;--pt:#0e1424;--p2:#1f2b52;--shadow:0 8px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.2rem)}h2{font-size:1.6rem}h3{font-size:1.15rem}
p{margin:0 0 1em}a{color:var(--p)}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav{max-width:1120px;margin:auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font:700 1.15rem Fraunces,serif;color:var(--ink);text-decoration:none}
.nav nav{display:flex;gap:4px;flex-wrap:wrap}
.nav nav a{color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:99px;font-weight:600;font-size:.95rem}
.nav nav a:hover,.nav nav a.on{background:var(--p2);color:var(--p)}
main{max-width:1120px;margin:auto;padding:32px 20px 56px;min-height:70vh}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--p);color:var(--pt);padding:12px 24px;border-radius:12px;font:600 1rem inherit;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(53,87,245,.3)}
.btn.alt{background:var(--p2);color:var(--p)}.btn.alt:hover{box-shadow:none}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center;padding:20px 0 40px}
.hero p{color:var(--muted);font-size:1.1rem;max-width:52ch}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.live{background:linear-gradient(145deg,var(--p),#6a4cf0);color:#fff;border:0}
.live .big{font:700 4rem Fraunces,serif;line-height:1}
.live .mini{display:flex;gap:24px;margin-top:18px}.live .mini b{display:block;font-size:1.4rem}
.stars-show{color:var(--star);letter-spacing:3px;font-size:1.3rem}
.feat h3{margin-top:6px}.feat span{font-size:1.8rem}
.auth{max-width:440px;margin:30px auto}
label.f,legend{display:block;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=password],input[type=email],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--p);outline:none;box-shadow:0 0 0 3px var(--p2)}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:10px 0 0}
.hint{color:var(--muted);font-size:.88rem}
fieldset{border:1px solid var(--line);border-radius:14px;margin:18px 0;padding:6px 18px 14px}
.q{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 0;border-bottom:1px dashed var(--line)}.q:last-child{border:0}
.q>span{flex:1 1 200px;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0}
.seg label{padding:6px 12px;border:1.5px solid var(--line);border-radius:99px;font-size:.85rem;cursor:pointer}
.seg input:checked+label{background:var(--p);border-color:var(--p);color:var(--pt)}
.seg input:focus-visible+label{outline:3px solid var(--star)}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;font-size:2.4rem}
.stars input{position:absolute;opacity:0}
.stars label{cursor:pointer;color:var(--line);padding:0 3px;transition:transform .15s}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:var(--star)}
.stars label:hover{transform:scale(1.2)}
.stars input:focus-visible+label{outline:3px solid var(--star)}
input[type=range]{width:100%;accent-color:var(--p)}
.chk{display:flex;gap:10px;align-items:center;margin-top:16px}
.course{display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;background:var(--p2);color:var(--p);padding:2px 12px;border-radius:99px;font-size:.8rem;font-weight:600;align-self:flex-start}
.tag.ok{background:rgba(19,181,160,.15);color:var(--ac)}
.course .btn{margin-top:auto;justify-content:center}
.tabs{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:20px}
.tabs select{width:auto;min-width:220px}
.stat b{display:block;font:700 2.2rem Fraunces,serif;color:var(--p)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:10px 0;font-size:.92rem}
.bar b{text-align:right}
.track{background:var(--p2);height:14px;border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),#6a4cf0);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.track i.g{background:linear-gradient(90deg,var(--star),#ffc95c)}
.cols{display:flex;align-items:flex-end;gap:12px;height:200px;border-bottom:2px solid var(--line)}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.8rem;font-weight:600}
.col i{display:block;width:100%;height:0;background:linear-gradient(var(--ac),var(--p));border-radius:8px 8px 0 0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.names{display:flex;gap:12px;font-size:.75rem;color:var(--muted);text-align:center;margin-top:6px}.names span{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.cm{border-left:4px solid var(--ac);padding:4px 14px;margin:12px 0;background:var(--bg);border-radius:0 10px 10px 0}
.cm small{color:var(--muted)}
.ok-big{text-align:center;max-width:520px;margin:40px auto}
.ok-big .tick{width:84px;height:84px;border-radius:50%;background:var(--ac);color:#fff;font-size:2.8rem;display:grid;place-items:center;margin:0 auto 20px;animation:pop .5s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:12px;transition:transform .3s;z-index:9}
#toast.show{transform:translate(-50%,0)}
@media (max-width:820px){.hero,.two{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="#home">Faculty Feedback Portal</a><nav id="nav" aria-label="Main"></nav></div></header>
<main id="app" tabindex="-1"></main>
<footer>Faculty Feedback &amp; Course Evaluation Portal · Demo data is stored only in your browser.</footer>
<div id="toast" role="status"></div>

<script>
/* ---------- Data ---------- */
const COURSES=[
 {code:"CS101",name:"Data Structures",fac:"Dr. Meera Kapoor",dept:"Computer Science",b:4.5,n:42},
 {code:"CS204",name:"Database Systems",fac:"Prof. Arjun Sethi",dept:"Computer Science",b:4.2,n:38},
 {code:"EC110",name:"Digital Electronics",fac:"Dr. Sunita Rao",dept:"Electronics",b:4.0,n:35},
 {code:"ME201",name:"Thermodynamics",fac:"Prof. Harpreet Singh",dept:"Mechanical",b:3.8,n:30},
 {code:"MA102",name:"Linear Algebra",fac:"Dr. Neha Verma",dept:"Mathematics",b:4.6,n:45},
 {code:"BM150",name:"Business Communication",fac:"Prof. Rohan Malhotra",dept:"Management",b:4.3,n:28}];
const Q=[["teaching","Teaching quality"],["content","Course content"],["clarity","Clarity of explanation"],["punctuality","Punctuality"],["interaction","Student interaction"],["satisfaction","Overall satisfaction"]];
const LV=["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"];
const POOL=["Explains hard ideas with real examples.","More practice problems before exams would help.","Lectures start on time and stay focused.","Great discussions, but the pace is fast.","Please share slides earlier.","Labs connect well with the theory."];

/* ---------- Storage (falls back to memory if blocked) ---------- */
const mem={};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}};
function seed(){let s=7;const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const cl=(x,a,b)=>Math.max(a,Math.min(b,Math.round(x)));const out=[];
 COURSES.forEach(c=>{for(let i=0;i<c.n;i++){const st=cl(c.b+(r()-.5)*2.4,1,5),sc={};Q.forEach(q=>sc[q[0]]=cl(c.b+(r()-.5)*2,1,5));
  out.push({course:c.code,stars:st,sc,exp:cl(st*2+(r()-.5)*3,1,10),comment:r()<.18?POOL[Math.floor(r()*POOL.length)]:"",sid:null,ts:Date.now()-Math.floor(r()*2e9)})}});return out}
let responses=load("ffp_resp",null);if(!responses){responses=seed();save("ffp_resp",responses)}
let submitted=load("ffp_done",[]);let sess=load("ffp_sess",null);

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const f1=n=>n.toFixed(1);
const cByCode=c=>COURSES.find(x=>x.code===c);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
const bar=(l,v,max,txt,cls="")=>`<div class="bar"><span>${l}</span><div class="track"><i class="${cls}" data-w="${v/max*100}"></i></div><b>${txt}</b></div>`;
const stars=n=>"★".repeat(Math.round(n))+"☆".repeat(5-Math.round(n));

/* ---------- Views: each returns [html, init] ---------- */
const V={};
V.home=()=>{const a=avg(responses.map(r=>r.stars));return[`
<section class="hero"><div><h1>Honest feedback, turned into better teaching.</h1>
<p>Rate your courses and faculty in about two minutes. Administrators get clear averages and charts, so good teaching is recognised and problems are fixed sooner. You can submit anonymously.</p>
<div class="row"><a class="btn" href="#student-login">Student login</a><a class="btn alt" href="#admin-login">Admin login</a></div></div>
<div class="card live"><div class="hint" style="color:#dbe3ff">Average rating across all courses</div><div class="big">${f1(a)}</div><div class="stars-show">${stars(a)}</div>
<div class="mini"><div><b>${responses.length}</b>responses</div><div><b>${COURSES.length}</b>courses</div></div></div></section>
<section class="grid">
<article class="card feat"><span>⭐</span><h3>Quick, structured</h3><p>Stars, sliders and scales replace long forms.</p></article>
<article class="card feat"><span>🔒</span><h3>Anonymous by choice</h3><p>Your name is never stored with an anonymous response.</p></article>
<article class="card feat"><span>📊</span><h3>Clear reports</h3><p>Live course-wise and faculty-wise analysis for admins.</p></article></section>`]};

V["student-login"]=()=>[`<form class="card auth" novalidate><h2>Student login</h2>
<p class="hint">Demo: use any ID with 6–12 letters or numbers (for example 24CS1001) and a password of 6+ characters.</p>
<label class="f" for="sid">Student ID</label><input type="text" id="sid" autocomplete="username" maxlength="12" placeholder="24CS1001">
<label class="f" for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" maxlength="30">
<p class="err" id="err"></p><button class="btn" style="width:100%;justify-content:center">Log in</button></form>`,
()=>$("form").onsubmit=e=>{e.preventDefault();const id=$("#sid").value.trim(),pw=$("#pw").value;
 if(!/^[A-Za-z0-9]{6,12}$/.test(id))return $("#err").textContent="Student ID must be 6–12 letters or numbers.";
 if(pw.length<6)return $("#err").textContent="Password must be at least 6 characters.";
 sess={role:"student",id:id.toUpperCase()};save("ffp_sess",sess);go("dashboard")}];

V["admin-login"]=()=>[`<form class="card auth" novalidate><h2>Admin login</h2>
<p class="hint">Demo credentials: <b>admin</b> / <b>admin123</b></p>
<label class="f" for="u">Username</label><input type="text" id="u" autocomplete="username">
<label class="f" for="pw">Password</label><input type="password" id="pw" autocomplete="current-password">
<p class="err" id="err"></p><button class="btn" style="width:100%;justify-content:center">Log in</button></form>`,
()=>$("form").onsubmit=e=>{e.preventDefault();
 if($("#u").value.trim()!=="admin"||$("#pw").value!=="admin123")return $("#err").textContent="Incorrect username or password.";
 sess={role:"admin",id:"admin"};save("ffp_sess",sess);go("admin")}];

V.dashboard=()=>{const mine=submitted.filter(k=>k.startsWith(sess.id+"|")).length;return[`
<div class="tabs"><div><h2>Welcome, ${esc(sess.id)}</h2><p class="hint" style="margin:0">${mine} of ${COURSES.length} courses evaluated</p></div></div>
<div class="grid">${COURSES.map(c=>{const d=submitted.includes(sess.id+"|"+c.code);return`
<article class="card course"><span class="tag ${d?"ok":""}">${d?"Submitted ✓":c.dept}</span><h3>${c.code} · ${c.name}</h3><p class="hint" style="margin:0">${c.fac} · ${c.dept}</p>
<a class="btn ${d?"alt":""}" href="#feedback.${c.code}" ${d?'aria-disabled="true"':""}>${d?"Already evaluated":"Evaluate course"}</a></article>`}).join("")}</div>`]};

V.feedback=(arg)=>[`<form class="card" style="max-width:780px;margin:auto" novalidate><h2>Course feedback</h2>
<label class="f" for="course">Course and faculty</label>
<select id="course"><option value="">Select a course</option>${COURSES.map(c=>`<option value="${c.code}" ${c.code===arg?"selected":""}>${c.code} · ${c.name} (${c.fac})</option>`).join("")}</select>
<fieldset><legend>Overall star rating</legend><div class="stars">${[5,4,3,2,1].map(n=>`<input type="radio" name="stars" id="s${n}" value="${n}"><label for="s${n}" title="${n} stars">★</label>`).join("")}</div></fieldset>
<fieldset><legend>How much do you agree?</legend>${Q.map(q=>`<div class="q" role="radiogroup" aria-label="${q[1]}"><span>${q[1]}</span><div class="seg">${LV.map((l,i)=>`<input type="radio" name="${q[0]}" id="${q[0]}${i}" value="${i+1}"><label for="${q[0]}${i}">${l}</label>`).join("")}</div></div>`).join("")}</fieldset>
<label class="f" for="exp">Overall experience: <b id="expv">5</b> / 10</label><input type="range" id="exp" min="1" max="10" value="5">
<label class="f" for="cm">Comments (optional)</label><textarea id="cm" rows="4" maxlength="500" placeholder="What worked well? What should change?"></textarea>
<p class="hint"><span id="cc">0</span>/500 characters</p>
<div class="chk"><input type="checkbox" id="anon" checked><label for="anon">Submit anonymously (your ID is not stored with the response)</label></div>
<p class="err" id="err" role="alert"></p>
<div style="display:flex;gap:12px;margin-top:10px"><button class="btn">Submit feedback</button><button type="reset" class="btn alt">Reset</button></div></form>`,
()=>{const f=$("form");$("#exp").oninput=e=>$("#expv").textContent=e.target.value;$("#cm").oninput=e=>$("#cc").textContent=e.target.value.length;
 f.onreset=()=>setTimeout(()=>{$("#expv").textContent=5;$("#cc").textContent=0;$("#err").textContent=""});
 f.onsubmit=e=>{e.preventDefault();const E=m=>$("#err").textContent=m,course=$("#course").value;
  const st=f.querySelector('input[name=stars]:checked'),sc={};
  if(!course)return E("Please choose a course.");
  if(submitted.includes(sess.id+"|"+course))return E("You have already evaluated this course. Each student can submit once per course.");
  if(!st)return E("Please give a star rating.");
  for(const q of Q){const c=f.querySelector(`input[name=${q[0]}]:checked`);if(!c)return E(`Please answer: ${q[1]}.`);sc[q[0]]=+c.value}
  const anon=$("#anon").checked;
  responses.push({course,stars:+st.value,sc,exp:+$("#exp").value,comment:$("#cm").value.trim(),sid:anon?null:sess.id,ts:Date.now()});
  submitted.push(sess.id+"|"+course);save("ffp_resp",responses);save("ffp_done",submitted);go("thanks")}}];

V.thanks=()=>[`<div class="card ok-big"><div class="tick">✓</div><h2>Thank you, feedback received</h2><p>Your response is now part of the admin summary. Each course can be evaluated once.</p>
<a class="btn" href="#dashboard">Back to my courses</a></div>`];

V.admin=(arg)=>{const code=arg||"all",list=code==="all"?responses:responses.filter(r=>r.course===code);
 const per=COURSES.map(c=>{const l=responses.filter(r=>r.course===c.code);return{...c,cnt:l.length,av:avg(l.map(r=>r.stars))}});
 const dist=[5,4,3,2,1].map(n=>list.filter(r=>r.stars===n).length),maxN=Math.max(...per.map(p=>p.cnt),1);
 const cms=list.filter(r=>r.comment).sort((a,b)=>b.ts-a.ts).slice(0,5);
 const row=(a,b,p)=>`<tr><td>${a}</td><td>${b}</td><td>${p.cnt}</td><td><b>${f1(p.av)}</b> <span class="stars-show" style="font-size:.9rem">${stars(p.av)}</span></td></tr>`;
 return[`<div class="tabs"><h2>Admin dashboard</h2><div style="display:flex;gap:10px;flex-wrap:wrap">
<select id="flt" aria-label="Filter by course"><option value="all">All courses</option>${COURSES.map(c=>`<option value="${c.code}" ${c.code===code?"selected":""}>${c.code} · ${c.name}</option>`).join("")}</select>
<button class="btn alt" id="reset">Reset demo data</button></div></div>
<div class="grid"><div class="card stat"><b>${list.length}</b>Total responses</div><div class="card stat"><b>${f1(avg(list.map(r=>r.stars)))}</b>Average rating (of 5)</div>
<div class="card stat"><b>${code==="all"?COURSES.length:1}</b>Courses</div><div class="card stat"><b>${code==="all"?new Set(COURSES.map(c=>c.fac)).size:1}</b>Faculty</div></div>
<div class="two"><div class="card"><h3>Average rating by course</h3>${per.map(p=>bar(p.name,p.av,5,Math.round(p.av/5*100)+"%")).join("")}</div>
<div class="card"><h3>Rating distribution</h3>${dist.map((n,i)=>bar(5-i+" stars",n,Math.max(...dist,1),Math.round(n/(list.length||1)*100)+"%","g")).join("")}</div></div>
<div class="two"><div class="card"><h3>Responses per course</h3><div class="cols">${per.map(p=>`<div class="col">${p.cnt}<i data-h="${p.cnt/maxN*100}"></i></div>`).join("")}</div><div class="names">${per.map(p=>`<span>${p.code}</span>`).join("")}</div></div>
<div class="card"><h3>Average by question</h3>${Q.map(q=>bar(q[1],avg(list.map(r=>r.sc[q[0]])),5,f1(avg(list.map(r=>r.sc[q[0]]))))).join("")}</div></div>
<div class="card tw" style="margin-top:18px"><h3>Course-wise analysis</h3><table><thead><tr><th>Course</th><th>Faculty</th><th>Responses</th><th>Average</th></tr></thead><tbody>${per.map(p=>row(p.code+" "+p.name,p.fac,p)).join("")}</tbody></table></div>
<div class="card tw" style="margin-top:18px"><h3>Faculty-wise analysis</h3><table><thead><tr><th>Faculty</th><th>Department</th><th>Responses</th><th>Average</th></tr></thead><tbody>${[...per].sort((a,b)=>b.av-a.av).map(p=>row(p.fac,p.dept,p)).join("")}</tbody></table></div>
<div class="card" style="margin-top:18px"><h3>Recent comments</h3>${cms.length?cms.map(r=>`<div class="cm">${esc(r.comment)}<br><small>${r.course} · ${stars(r.stars)} · ${r.sid?esc(r.sid):"Anonymous"}</small></div>`).join(""):'<p class="hint">No comments yet.</p>'}</div>`,
 ()=>{$("#flt").onchange=e=>go("admin"+(e.target.value==="all"?"":"."+e.target.value));
  $("#reset").onclick=()=>{responses=seed();submitted=[];save("ffp_resp",responses);save("ffp_done",submitted);toast("Demo data restored");render()}}]};

/* ---------- Router ---------- */
function go(r){location.hash=r}
function render(){
 const [name,arg]=(location.hash.slice(1)||"home").split(".");let v=V[name]?name:"home";
 if(v==="admin"&&!(sess&&sess.role==="admin"))v="admin-login";
 if((v==="dashboard"||v==="feedback"||v==="thanks")&&!(sess&&sess.role==="student"))v="student-login";
 const [html,init]=V[v](arg);const app=$("#app");app.innerHTML=html;if(init)init();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{app.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");app.querySelectorAll("[data-h]").forEach(e=>e.style.height=e.dataset.h+"%")}));
 const L=[["home","Home"]];
 if(!sess)L.push(["student-login","Student"],["admin-login","Admin"]);
 else L.push([sess.role==="admin"?"admin":"dashboard",sess.role==="admin"?"Dashboard":"My courses"],["logout","Log out"]);
 $("#nav").innerHTML=L.map(l=>`<a href="#${l[0]}" class="${l[0]===v?"on":""}">${l[1]}</a>`).join("");
 window.scrollTo(0,0);
}
addEventListener("hashchange",()=>{if(location.hash==="#logout"){sess=null;save("ffp_sess",null);toast("Logged out");return go("home")}render()});
render();
</script>
</body>
</html>
